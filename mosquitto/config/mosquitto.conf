# Configuración de Eclipse Mosquitto para AmazonIA 4.0
listener 1883
allow_anonymous true

# Soporte para WebSockets (Dashboard / UI)
listener 9001
protocol websockets
allow_anonymous true

# Persistencia
persistence true
persistence_location /mosquitto/data/

# Registro de logs
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
